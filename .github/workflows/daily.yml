name: Daily update
on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Écrire la date du jour
        run: date -u +"%Y-%m-%d" > last-update.txt
      - name: Commit et push
        run: |
          git config user.name "Rivaldo AKO"
          git config user.email "rivaldoako25@gmail.com"
          git add last-update.txt
          git commit -m "chore: daily update"
          git push
